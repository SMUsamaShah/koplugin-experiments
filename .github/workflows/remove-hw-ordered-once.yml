name: Remove HW ordered dither tests once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-hw-ordered-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove HW ordered dither tests
        shell: python
        run: |
          from pathlib import Path

          p = Path('einkmotionlab.koplugin/main.lua')
          s = p.read_text()
          for snippet in [
              '        { name = "KOReader A2 + HW ordered dither", api = "a2", dither = true },\n',
              '        { name = "KOReader DU + HW ordered dither", api = "fast", dither = true },\n',
          ]:
              if snippet not in s:
                  raise SystemExit('Expected test not found: ' + snippet)
              s = s.replace(snippet, '', 1)
          p.write_text(s)

          meta = Path('einkmotionlab.koplugin/_meta.lua')
          m = meta.read_text()
          if 'version = "0.1.6"' not in m:
              raise SystemExit('Expected Motion Lab version 0.1.6 not found')
          meta.write_text(m.replace('version = "0.1.6"', 'version = "0.1.7"', 1))

          readme = Path('einkmotionlab.koplugin/README.md')
          r = readme.read_text()
          r = r.replace('- A2 + hardware ordered dithering\n', '')
          r = r.replace('- DU + hardware ordered dithering\n', '')
          readme.write_text(r)

          Path('.github/workflows/remove-hw-ordered-once.yml').unlink()

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove hardware ordered dither tests" || exit 0
          git push
