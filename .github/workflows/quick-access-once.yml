name: Motion Lab quick access one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/quick-access-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Motion Lab quick access
        shell: python
        run: |
          from pathlib import Path

          p = Path('einkmotionlab.koplugin/main.lua')
          s = p.read_text()

          def replace_once(old, new):
              global s
              if old not in s:
                  raise SystemExit('Expected text not found:\n' + old)
              s = s.replace(old, new, 1)

          replace_once(
              'local Device = require("device")\n',
              'local Device = require("device")\nlocal Dispatcher = require("dispatcher")\n'
          )

          replace_once(
              'local function radioItem(text, checked, callback)\n    return {\n        text = text,\n        radio = true,\n        checked_func = checked,\n        callback = callback,\n    }\nend\n\nfunction MotionLab:init()',
              '''local function radioItem(text, checked, callback)\n    return {\n        text = text,\n        radio = true,\n        checked_func = checked,\n        callback = callback,\n    }\nend\n\nfunction MotionLab:onDispatcherRegisterActions()\n    Dispatcher:registerAction("einkmotionlab_run_everything", {\n        category = "none",\n        event = "EInkMotionLabRunEverything",\n        title = _("E-Ink Motion Lab: run everything"),\n        reader = true,\n    })\n    Dispatcher:registerAction("einkmotionlab_repeat_last", {\n        category = "none",\n        event = "EInkMotionLabRepeatLast",\n        title = _("E-Ink Motion Lab: repeat last individual test"),\n        reader = true,\n    })\nend\n\nfunction MotionLab:init()'''
          )

          replace_once(
              '    self.results_path = DataStorage:getSettingsDir() .. "/einkmotionlab-last.txt"\n    self.ui.menu:registerToMainMenu(self)\n',
              '    self.results_path = DataStorage:getSettingsDir() .. "/einkmotionlab-last.txt"\n    self:onDispatcherRegisterActions()\n    self.ui.menu:registerToMainMenu(self)\n'
          )

          replace_once(
              'function MotionLab:individualItems()\n',
              '''function MotionLab:repeatLastIndividualTest()\n    local wanted = G_reader_settings:readSetting("einkmotionlab_last_test")\n    if not wanted then\n        return "No individual test has been run yet. Run one once from the Motion Lab menu."\n    end\n\n    for _, test in ipairs(self:getVisualTests()) do\n        if test.name == wanted then\n            local snapshot = Screen.bb:copy()\n            local x, y, size = self:getPatchRect(self.patch_size)\n            local result = self:runVisualTest(test, size, test.frames or self.frames)\n            self:restorePatch(snapshot, x, y, size)\n            snapshot:free()\n            UIManager:setDirty(self.ui, "ui")\n            return "Repeated: " .. result\n        end\n    end\n\n    return "The previously selected test is no longer available: " .. tostring(wanted)\nend\n\nfunction MotionLab:onEInkMotionLabRunEverything()\n    self:runSafely("everything", function() return self:runEverything() end)\nend\n\nfunction MotionLab:onEInkMotionLabRepeatLast()\n    self:runSafely("repeat last test", function() return self:repeatLastIndividualTest() end)\nend\n\nfunction MotionLab:individualItems()\n'''
          )

          replace_once(
              '        table.insert(items, {\n            text = test.name,\n            callback = function()\n                self:runSafely(test.name, function()',
              '        table.insert(items, {\n            text = test.name,\n            keep_menu_open = true,\n            callback = function()\n                G_reader_settings:saveSetting("einkmotionlab_last_test", test.name)\n                self:runSafely(test.name, function()'
          )

          replace_once(
              '        sorting_hint = "more_tools",\n',
              '        sorting_hint = "tools",\n'
          )

          replace_once(
              '''            {\n                text = _("Run Perlin-like motion suite"),''',
              '''            {\n                text = _("Repeat last individual test"),\n                callback = function()\n                    self:runSafely("repeat last test",\n                        function() return self:repeatLastIndividualTest() end)\n                end,\n            },\n            {\n                text = _("Run Perlin-like motion suite"),'''
          )

          p.write_text(s)

          meta = Path('einkmotionlab.koplugin/_meta.lua')
          m = meta.read_text()
          if 'version = "0.1.2"' not in m:
              raise SystemExit('Expected Motion Lab version 0.1.2 not found')
          meta.write_text(m.replace('version = "0.1.2"', 'version = "0.1.3"', 1))

          readme = Path('einkmotionlab.koplugin/README.md')
          r = readme.read_text()
          marker = '**E-Ink Motion / Grayscale Lab**\n'
          note = '''\nFor quicker repeated testing, the plugin now appears directly in the main **Tools** menu instead of **More tools**. It also registers two KOReader actions: **E-Ink Motion Lab: run everything** and **E-Ink Motion Lab: repeat last individual test**. Assign either action to a gesture or put it in a Quick Menu for one-gesture access. Individual tests keep the menu open and the last selected test is remembered.\n'''
          if note.strip() not in r:
              if marker in r:
                  r = r.replace(marker, marker + note, 1)
              else:
                  r += note
              readme.write_text(r)

          Path('.github/workflows/quick-access-once.yml').unlink()

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve Motion Lab quick access" || exit 0
          git push
