name: Motion Lab scheduler diagnostics one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/motionlab-scheduler-diagnostics-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_motionlab_scheduler.py
      - run: rm .github/scripts/patch_motionlab_scheduler.py .github/workflows/motionlab-scheduler-diagnostics-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Motion Lab frame scheduler diagnostics"
          git push
