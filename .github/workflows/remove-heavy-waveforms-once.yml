name: Remove heavy waveform tests once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-heavy-waveforms-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove heavy waveform tests
        shell: python
        run: |
          from pathlib import Path

          p = Path('einkmotionlab.koplugin/main.lua')
          s = p.read_text()

          old = '''        -- The heavier true-gray waveform tests are intentionally short.\n        { name = "Raw GC16 queued/no waits", waveform = C.WAVEFORM_MODE_GC16,\n            frames = 8 },\n        { name = "Raw GC16 synchronized", waveform = C.WAVEFORM_MODE_GC16,\n            wait_each = true, frames = 6 },\n        { name = "Raw GL16 queued/no waits", waveform = C.WAVEFORM_MODE_ZELDA_GL16,\n            frames = 10 },\n        { name = "Raw GLR16 PARTIAL queued", waveform = C.WAVEFORM_MODE_ZELDA_GLR16,\n            update_mode = C.UPDATE_MODE_PARTIAL, frames = 8 },\n        { name = "Raw GLD16 PARTIAL + ordered", waveform = C.WAVEFORM_MODE_ZELDA_GLD16,\n            update_mode = C.UPDATE_MODE_PARTIAL,\n            dither_mode = C.EPDC_FLAG_USE_DITHERING_ORDERED, quant_bit = 7,\n            flags = C.EPDC_FLAG_USE_ZELDA_REGAL, frames = 8 },\n\n        -- This intentionally goes through KOReader's conservative REAGL path.\n        { name = "KOReader Partial/REAGL synchronized", api = "partial",\n            wait_each = true, frames = 4 },\n'''
          if old not in s:
              raise SystemExit('Expected heavy waveform test block not found')
          s = s.replace(old, '', 1)
          p.write_text(s)

          meta = Path('einkmotionlab.koplugin/_meta.lua')
          m = meta.read_text()
          if 'version = "0.1.5"' not in m:
              raise SystemExit('Expected Motion Lab version 0.1.5 not found')
          meta.write_text(m.replace('version = "0.1.5"', 'version = "0.1.6"', 1))

          readme = Path('einkmotionlab.koplugin/README.md')
          r = readme.read_text()
          r = r.replace('- synchronized Partial/REAGL\n', '')
          for line in [
              '- GC16 queued\n',
              '- GC16 serialized\n',
              '- GL16 queued\n',
              '- GLR16 partial queued\n',
              '- GLD16 partial + ordered dithering / REGAL flag\n',
          ]:
              r = r.replace(line, '')
          readme.write_text(r)

          Path('.github/workflows/remove-heavy-waveforms-once.yml').unlink()

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove heavy grayscale waveform tests" || exit 0
          git push
