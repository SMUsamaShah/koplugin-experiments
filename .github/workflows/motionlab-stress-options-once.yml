name: Motion Lab stress options one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/motionlab-stress-options-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand Motion Lab stress-test controls
        shell: python
        run: |
          from pathlib import Path

          p = Path('einkmotionlab.koplugin/main.lua')
          s = p.read_text()

          def replace_once(old, new):
              global s
              if old not in s:
                  raise SystemExit('Expected text not found:\n' + old)
              s = s.replace(old, new, 1)

          replace_once(
              '    self.block_size = tonumber(G_reader_settings:readSetting("einkmotionlab_block_size")) or 4\n',
              '    self.block_size = tonumber(G_reader_settings:readSetting("einkmotionlab_block_size")) or 4\n    self.bayer_block_size = tonumber(G_reader_settings:readSetting("einkmotionlab_bayer_block_size")) or 2\n'
          )

          replace_once(
              '''function MotionLab:setBlockSize(v)\n    self.block_size = v\n    G_reader_settings:saveSetting("einkmotionlab_block_size", v)\nend\n''',
              '''function MotionLab:setBlockSize(v)\n    self.block_size = v\n    G_reader_settings:saveSetting("einkmotionlab_block_size", v)\nend\n\nfunction MotionLab:setBayerBlockSize(v)\n    self.bayer_block_size = v\n    G_reader_settings:saveSetting("einkmotionlab_bayer_block_size", v)\nend\n'''
          )

          s = s.replace(
              'render_mode = "ordered_binary", block_size = 2 },',
              'render_mode = "ordered_binary", block_size = self.bayer_block_size },'
          )

          old_patch = '''                    radioItem("128 x 128", function() return self.patch_size == 128 end,\n                        function() self:setPatchSize(128) end),\n                    radioItem("192 x 192", function() return self.patch_size == 192 end,\n                        function() self:setPatchSize(192) end),'''
          new_patch = '''                    radioItem("128 x 128", function() return self.patch_size == 128 end,\n                        function() self:setPatchSize(128) end),\n                    radioItem("192 x 192", function() return self.patch_size == 192 end,\n                        function() self:setPatchSize(192) end),\n                    radioItem("256 x 256", function() return self.patch_size == 256 end,\n                        function() self:setPatchSize(256) end),\n                    radioItem("384 x 384", function() return self.patch_size == 384 end,\n                        function() self:setPatchSize(384) end),\n                    radioItem("512 x 512", function() return self.patch_size == 512 end,\n                        function() self:setPatchSize(512) end),\n                    radioItem("768 x 768", function() return self.patch_size == 768 end,\n                        function() self:setPatchSize(768) end),\n                    radioItem("1024 x 1024", function() return self.patch_size == 1024 end,\n                        function() self:setPatchSize(1024) end),'''
          replace_once(old_patch, new_patch)

          old_frames = '''                    radioItem("36", function() return self.frames == 36 end,\n                        function() self:setFrames(36) end),\n                    radioItem("48", function() return self.frames == 48 end,\n                        function() self:setFrames(48) end),'''
          new_frames = '''                    radioItem("36", function() return self.frames == 36 end,\n                        function() self:setFrames(36) end),\n                    radioItem("48", function() return self.frames == 48 end,\n                        function() self:setFrames(48) end),\n                    radioItem("60", function() return self.frames == 60 end,\n                        function() self:setFrames(60) end),\n                    radioItem("120", function() return self.frames == 120 end,\n                        function() self:setFrames(120) end),\n                    radioItem("240", function() return self.frames == 240 end,\n                        function() self:setFrames(240) end),\n                    radioItem("480", function() return self.frames == 480 end,\n                        function() self:setFrames(480) end),\n                    radioItem("960", function() return self.frames == 960 end,\n                        function() self:setFrames(960) end),'''
          replace_once(old_frames, new_frames)

          marker = '''            {\n                text = _("Noise render block size"),'''
          bayer_menu = '''            {\n                text = _("SW Bayer block size"),\n                sub_item_table = {\n                    radioItem("2 px (best-looking, most CPU)", function() return self.bayer_block_size == 2 end,\n                        function() self:setBayerBlockSize(2) end),\n                    radioItem("4 px (faster for large patches)", function() return self.bayer_block_size == 4 end,\n                        function() self:setBayerBlockSize(4) end),\n                    radioItem("8 px (stress large display regions)", function() return self.bayer_block_size == 8 end,\n                        function() self:setBayerBlockSize(8) end),\n                    radioItem("16 px (minimize Lua render cost)", function() return self.bayer_block_size == 16 end,\n                        function() self:setBayerBlockSize(16) end),\n                },\n            },\n'''
          replace_once(marker, bayer_menu + marker)

          p.write_text(s)

          meta = Path('einkmotionlab.koplugin/_meta.lua')
          m = meta.read_text()
          if 'version = "0.1.3"' not in m:
              raise SystemExit('Expected Motion Lab version 0.1.3 not found')
          meta.write_text(m.replace('version = "0.1.3"', 'version = "0.1.4"', 1))

          readme = Path('einkmotionlab.koplugin/README.md')
          r = readme.read_text()
          note = '''\n## Large-patch / long-run stress testing\n\nFor the promising software Bayer modes, the menu now supports patch sizes up to **1024 x 1024** and run lengths up to **960 frames**. A separate **SW Bayer block size** control (2/4/8/16 px) lets you trade visual fineness for much lower Lua rendering cost when testing large regions. Start at 2 px for appearance; if large patches become CPU-bound, try 4 or 8 px to isolate E-Ink/EPDC update performance.\n'''
          if '## Large-patch / long-run stress testing' not in r:
              r += note
              readme.write_text(r)

          Path('.github/workflows/motionlab-stress-options-once.yml').unlink()

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Motion Lab animation stress options" || exit 0
          git push
