name: Motion Lab telemetry hotfix one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/motionlab-logging-hotfix-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix single-value sysfs reads
        shell: python
        run: |
          from pathlib import Path
          p = Path('einkmotionlab.koplugin/main.lua')
          s = p.read_text()
          assert 'if value then return value, path end' in s
          s = s.replace('if value then return value, path end', 'if value then return value end', 1)
          assert 'return nil, nil' in s
          s = s.replace('return nil, nil', 'return nil', 1)
          p.write_text(s)
      - name: Remove one-shot workflow
        run: rm .github/workflows/motionlab-logging-hotfix-once.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Motion Lab telemetry sysfs reads" || exit 0
          git push
